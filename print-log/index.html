<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Print Log — 3D print settings tracker · Isaac Chan</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Track every 3D print: material, temperatures, layer height, speed, result and notes — and see your proven settings.">
<meta property="og:title" content="Print Log · Isaac Chan">
<meta property="og:image" content="/og-image.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0d12;--card:#12151d;--card2:#171b25;--bd:#252b38;--t1:#e8ebf2;--t2:#9aa4b8;--t3:#6b7488;--ab:#7170ff;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b6b}
body{background:var(--bg);color:var(--t1);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 18px 80px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--t3);font-size:13px;margin:4px 0 20px}
.back{display:inline-block;color:var(--t2);text-decoration:none;font-size:13px;margin-bottom:16px;border:1px solid var(--bd);padding:6px 12px;border-radius:8px}
.back:hover{border-color:var(--ab);color:var(--t1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.stat .n{font-size:24px;font-weight:600}
.stat .l{color:var(--t3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.panel h2{font-size:16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:block;font-size:11.5px;color:var(--t2);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--t1);padding:8px 10px;border-radius:8px;font-size:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ab)}
textarea{resize:vertical;min-height:52px}
button{background:var(--ab);border:none;color:#fff;padding:10px 18px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.12)}
button.ghost{background:transparent;border:1px solid var(--bd);color:var(--t2)}
button.ghost:hover{border-color:var(--ab);color:#fff}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.msg{font-size:13px;color:var(--t3)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid}
.b-ok{color:var(--ok);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.b-warn{color:var(--warn);border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.08)}
.b-fail{color:var(--bad);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}
.del{background:transparent;border:1px solid var(--bd);color:var(--t3);padding:4px 9px;font-size:12px;border-radius:7px}
.del:hover{border-color:var(--bad);color:var(--bad)}
.empty{color:var(--t3);font-size:13.5px;padding:18px 0;text-align:center}
footer{margin-top:30px;color:var(--t3);font-size:12px;text-align:center}
@media print{.back,.panel form,.actions,.del,th:last-child,td:last-child{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="/">← Home</a>
<h1>🖨️ Print Log</h1>
<div class="sub">Every 3D print I've run — material, temps, layer height, speed, result. Builds up into my proven-settings database.</div>
<div class="stats" id="stats"></div>
<div class="panel">
  <h2>Log a print</h2>
  <form id="f" onsubmit="return addPrint(event)">
    <div class="grid">
      <div style="grid-column:span 2"><label>Project / part</label><input name="name" required placeholder="e.g. VEX axle bush x4"></div>
      <div><label>Material</label><select name="material"><option>PLA</option><option>PETG</option><option>ABS</option><option>TPU</option><option>ASA</option><option>Nylon</option><option>Resin</option></select></div>
      <div><label>Nozzle °C</label><input name="nozzle" type="number" value="210"></div>
      <div><label>Bed °C</label><input name="bed" type="number" value="60"></div>
      <div><label>Layer mm</label><input name="layer" type="number" step="0.02" value="0.2"></div>
      <div><label>Speed mm/s</label><input name="speed" type="number" value="150"></div>
      <div><label>Infill %</label><input name="infill" type="number" value="15"></div>
      <div><label>Filament g</label><input name="grams" type="number" step="0.1" placeholder="42"></div>
      <div><label>Time h</label><input name="hours" type="number" step="0.1" placeholder="3.5"></div>
      <div><label>Result</label><select name="result"><option value="ok">✅ Clean</option><option value="warn">⚠️ Usable / issues</option><option value="fail">❌ Failed</option></select></div>
    </div>
    <div style="margin-top:12px"><label>Notes</label><textarea name="notes" placeholder="What worked, what to change next time…"></textarea></div>
    <div class="actions">
      <input name="pass" type="password" placeholder="passcode" style="width:130px" autocomplete="off">
      <button type="submit">Add print</button>
      <button type="button" class="ghost" onclick="useLast()">Use last settings</button>
      <span class="msg" id="msg"></span>
    </div>
  </form>
</div>
<div class="panel">
  <h2>History <span class="msg" id="cnt"></span></h2>
  <div id="list"></div>
</div>
<footer>Built by Isaac · <a href="/tools/" style="color:var(--t2)">Workshop Tools</a> · <a href="/portfolio/" style="color:var(--t2)">Portfolio</a></footer>
</div>
<script src="/print-log/printlog.js"></script>
</body>
</html>
